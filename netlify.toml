[build]
  base = "artifacts/bytech"
  command = "corepack enable && cd ../.. && pnpm install && pnpm --filter @workspace/bytech build"
  publish = "dist/public"

[[redirects]]
  from = "/api/*"
  to = "https://PUT-YOUR-RENDER-URL-HERE.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  BASE_PATH = "/"
  PORT = "5173"
